# tmux >= 3.2; local validation baseline: 3.7c.
# No plugins, installation, project discovery or automatic restoration.
set -g default-terminal tmux-256color
set -s focus-events on
set -s extended-keys on
%if #{>=:#{version},3.5}
set -s extended-keys-format csi-u
%endif
set -s escape-time 10
set -s set-clipboard on
set -s copy-command ''
set -g mouse on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows off
set -g repeat-time 0
set -g mode-keys vi
set -g display-time 2000
set -g status-interval 1
set -g set-titles off
set -g automatic-rename on
set -g update-environment 'DISPLAY WAYLAND_DISPLAY XAUTHORITY SSH_AUTH_SOCK SSH_CONNECTION SSH_CLIENT SSH_TTY'

unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind a last-window
bind Tab last-window
bind d detach-client
bind s choose-tree -Zs
bind w choose-tree -Zw
bind S command-prompt -p 'New session:' { new-session -s '%%' -c '#{pane_current_path}' }
bind c new-window -c '#{pane_current_path}'
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
unbind '%'
unbind '"'
bind n next-window
bind p previous-window
bind z resize-pane -Z
# Stop at the outside edge; do not silently unzoom.
bind h if -F '#{||:#{window_zoomed_flag},#{pane_at_left}}' '' 'select-pane -L'
bind j if -F '#{||:#{window_zoomed_flag},#{pane_at_bottom}}' '' 'select-pane -D'
bind k if -F '#{||:#{window_zoomed_flag},#{pane_at_top}}' '' 'select-pane -U'
bind l if -F '#{||:#{window_zoomed_flag},#{pane_at_right}}' '' 'select-pane -R'

bind r switch-client -T resize
bind -T resize h resize-pane -L 2 \; switch-client -T resize
bind -T resize j resize-pane -D 2 \; switch-client -T resize
bind -T resize k resize-pane -U 2 \; switch-client -T resize
bind -T resize l resize-pane -R 2 \; switch-client -T resize
bind -T resize q switch-client -T root
bind -T resize Escape switch-client -T root
bind -T resize Any switch-client -T root

bind x confirm-before -p 'Close pane #P (#T / #{pane_current_command})? (y/n)' kill-pane
bind '&' confirm-before -p 'Close window #I (#W)? (y/n)' kill-window
bind '[' copy-mode
bind ']' paste-buffer -p
bind '=' choose-buffer -Z
bind / copy-mode \; command-prompt -i -p 'Search backward:' { send-keys -X search-backward-incremental '%%' }
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi / command-prompt -i -p 'Search forward:' { send-keys -X search-forward-incremental '%%' }
bind -T copy-mode-vi ? command-prompt -i -p 'Search backward:' { send-keys -X search-backward-incremental '%%' }
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind g if-shell 'command -v lazygit >/dev/null 2>&1' {
  display-popup -d '#{pane_current_path}' -w 90% -h 90% -E lazygit
} { display-message 'lazygit is not installed; no changes made' }
bind R run-shell 'if output=$(tmux source-file "$HOME/.config/tmux/tmux.conf" 2>&1); then tmux display-message "tmux configuration reloaded"; else tmux display-message "Reload failed: $output"; fi'

# Static Astrodark colors (docs/theme-source.md); no runtime dependency.
set -g status-position bottom
set -g status-justify centre
set -g status-style 'fg=#ADB0BB,bg=#111317'
set -g status-left-length 60
set -g status-right-length 60
set -g status-left '#[fg=#50A4E9,bg=#111317]#[fg=#111317,bg=#50A4E9,bold] #[fg=#ADB0BB,bg=#26343F,nobold] #h / #S #[fg=#26343F,bg=#111317]#[default] '
set -g status-right '#{?client_prefix,#[fg=#DFAB25] PREFIX ,}#{?pane_in_mode,#[fg=#87C05F] COPY ,}#{?#{==:#{client_key_table},resize},#[fg=#DD97F1] RESIZE ,}#{?window_zoomed_flag,#[fg=#5EB7FF] ZOOM ,}#[default]'
# Catppuccin-style rounded caps, with explicit backgrounds to avoid corner artifacts.
set -g window-status-format '#[fg=#34363A,bg=#111317]#[fg=#ADB0BB,bg=#34363A]#I#[bg=#16181D] #W #[fg=#16181D,bg=#111317]#[default]'
set -g window-status-current-format '#[fg=#50A4E9,bg=#111317]#[fg=#111317,bg=#50A4E9,bold]#I#[fg=#5EB7FF,bg=#26343F] #W #[fg=#26343F,bg=#111317,nobold]#[default]'
set -g window-status-separator ' '
set -g pane-border-style 'fg=#34363A'
set -g pane-active-border-style 'fg=#50A4E9'
set -g message-style 'fg=#ADB0BB,bg=#26343F'
set -g message-command-style 'fg=#ADB0BB,bg=#26343F'
set -g mode-style 'fg=#ADB0BB,bg=#26343F'

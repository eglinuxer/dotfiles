# Match Downloads/dotfiles-main: Catppuccin Mocha v2.3.0, basic windows,
# terminal background, application + session modules on the right.
# Reset theme defaults so reloads do not retain earlier custom separators.
set -g @catppuccin_reset true
source-file -F "#{d:current_file}/../vendor/catppuccin/catppuccin_options_tmux.conf"
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background 'none'
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# Explicit defaults also restore the layout when reloading the previous theme.
set -g status-position bottom
set -g status-justify left
set -g window-status-separator ' '
set -g window-status-style default
set -g window-status-current-style default
set -g status-left ''
set -g status-right-length 100
set -g status-right '#{?#{==:#{client_key_table},off},#[fg=#f38ba8#,bold] REMOTE #[default],}'
set -ag status-right '#{E:@catppuccin_status_application}'
set -ag status-right '#{E:@catppuccin_status_session}'
set -g popup-border-lines rounded
set -g popup-border-style 'fg=#b4befe'

# Load the original theme synchronously; no TPM or network needed at startup.
source-file -F "#{d:current_file}/../vendor/catppuccin/catppuccin_tmux.conf"
set -g status-style bg=default
